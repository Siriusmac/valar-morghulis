name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Configura pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile
      - name: Compila la web app
        run: pnpm run build
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
